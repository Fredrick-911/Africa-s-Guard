# AfriGuard Verify — backend stack
# Run with:  docker compose up --build

services:
  backend:
    build: .
    image: afriguard-backend
    container_name: afriguard-backend
    env_file:
      - .env                       # TWILIO_* creds, etc. (never committed)
    ports:
      - "8000:8000"
    volumes:
      # Cache the Hugging Face models so they download only once
      - afriguard-models:/app/.cache/huggingface
    restart: unless-stopped

  # Optional: exposes the backend on a public HTTPS URL so Twilio's webhook
  # can reach it. Needs NGROK_AUTHTOKEN in your .env. Remove this service if
  # you'd rather run ngrok on the host as before.
  # Grab the public URL from the ngrok dashboard at http://localhost:4040
  ngrok:
    image: ngrok/ngrok:latest
    container_name: afriguard-ngrok
    command: http backend:8000
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  afriguard-models: